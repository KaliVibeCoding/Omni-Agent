kind = "web"
previewPath = "/"
title = "Twilio Omni-Agent"
version = "1.0.0"
id = "artifacts/twilio-omni-agent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19805

[services.development]
run = "pnpm --filter @workspace/twilio-omni-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/twilio-omni-agent", "run", "build" ]
publicDir = "artifacts/twilio-omni-agent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19805"
BASE_PATH = "/"
